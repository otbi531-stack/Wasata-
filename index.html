<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج بيانات شقق عمارة المعابدة</title>
    <!-- استدعاء خط القاهرة الرسمي لجعله الخط الافتراضي -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; margin: 25px; background-color: #f4f7f6; color: #2c3e50; text-align: right; }
        .form-container { max-width: 550px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
        h2 { text-align: center; color: #1a252f; font-weight: 700; margin-bottom: 30px; border-bottom: 3px solid #3498db; padding-bottom: 12px; font-size: 24px; }
        .form-group { margin-bottom: 22px; }
        label { display: block; margin-bottom: 10px; font-weight: 700; color: #34495e; font-size: 18px; }
        select, input[type="text"], input[type="tel"], textarea { width: 100%; padding: 14px; border: 2px solid #bdc3c7; border-radius: 8px; box-sizing: border-box; font-size: 18px; font-family: 'Cairo', sans-serif; font-weight: 700; color: #2c3e50; }
        select:focus, input:focus { border-color: #3498db; outline: none; }
        .btn-export { width: 100%; padding: 16px; background-color: #27ae60; color: white; border: none; border-radius: 8px; font-size: 20px; font-weight: 700; cursor: pointer; margin-top: 20px; font-family: 'Cairo', sans-serif; box-shadow: 0 4px 6px rgba(39,174,96,0.2); }
        .btn-export:active { background-color: #219653; transform: scale(0.99); }
        .output-container { margin-top: 25px; display: none; background: #eef9f2; padding: 20px; border-radius: 8px; border: 2px dashed #27ae60; }
        .output-container label { color: #27ae60; font-size: 18px; }
        textarea { background: white; font-size: 18px; height: 320px; resize: none; line-height: 1.6; color: #111; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>عمارة المعابده - نموذج بيانات الشقق</h2>
    
    <div class="form-group">
        <label>رقم الشقة:</label>
        <select id="apartment_number" onchange="resetOutput()">
            <option value="">-- اختر رقم الشقة --</option>
            <option value="شقة ١">شقة ١</option>
            <option value="شقة ٢">شقة ٢</option>
            <option value="شقة ٣">شقة ٣</option>
            <option value="شقة ٤">شقة ٤</option>
            <option value="شقة ٥">شقة ٥</option>
            <option value="شقة ٦">شقة ٦</option>
            <option value="شقة ٧">شقة ٧</option>
        </select>
    </div>

    <div class="form-group">
        <label>حالة الشقة:</label>
        <select id="apartment_status">
            <option value="">-- اختر حالة الشقة --</option>
            <option value="مؤجرة">مؤجرة</option>
            <option value="فارغة">فارغة</option>
        </select>
    </div>

    <div class="form-group">
        <label>إسم المستأجر:</label>
        <input type="text" id="tenant_name" placeholder="أدخل اسم المستأجر">
    </div>

    <div class="form-group">
        <label>رقم الهوية أو الإقامة:</label>
        <input type="text" id="id_number" placeholder="أدخل رقم الهوية أو الإقامة">
    </div>

    <div class="form-group">
        <label>رقم الجوال:</label>
        <input type="tel" id="mobile_number" placeholder="أدخل رقم الجوال">
    </div>

    <div class="form-group">
        <label>رقم العداد:</label>
        <select id="meter_number">
            <option value="">-- اختر رقم العداد --</option>
            <option value="LYE2020800438761">LYE2020800438761</option>
            <option value="LYE2020800438766">LYE2020800438766</option>
            <option value="LYE2020800438767">LYE2020800438767</option>
            <option value="LYE2020800438765">LYE2020800438765</option>
            <option value="LYE2020800438763">LYE2020800438763</option>
            <option value="LYE2020800438764">LYE2020800438764</option>
            <option value="GTR2320892254123">GTR2320892254123</option>
        </select>
    </div>

    <div class="form-group">
        <label>رقم الحساب الرئيسي:</label>
        <select id="main_account">
            <option value="">-- اختر رقم الحساب الرئيسي --</option>
            <option value="30095181890">30095181890</option>
            <option value="30095181871">30095181871</option>
            <option value="30095181853">30095181853</option>
            <option value="30125660357">30125660357</option>
            <option value="30095181915">30095181915</option>
            <option value="30095181835">30095181835</option>
            <option value="30095181942">30095181942</option>
        </select>
    </div>

    <div class="form-group">
        <label>رقم الحساب الفرعي (إدخال يدوي):</label>
        <input type="text" id="sub_account" placeholder="أدخل رقم الحساب الفرعي">
    </div>

    <button type="button" class="btn-export" onclick="generateText()">📊 تجهيز البيانات للنسخ</button>

    <div id="outputSection" class="output-container">
        <label>📋 انسخ النص المظلل بالأسفل وضعه في ملفك مباشرة:</label>
        <textarea id="outputText" readonly></textarea>
    </div>
</div>

<script>
    function resetOutput() {
        document.getElementById("outputSection").style.display = "none";
    }

    function generateText() {
        const apt = document.getElementById("apartment_number").value;
        if (!apt) { alert("الرجاء اختيار رقم الشقة أولاً!"); return; }

        let text = `* ${apt}\n\n`;
        text += `  - حالة الشقة: ${document.getElementById("apartment_status").value || 'فارغة'}\n\n`;
        text += `  - إسم المستأجر: ${document.getElementById("tenant_name").value || ''}\n\n`;
        text += `  - رقم الهوية أو الإقامة: ${document.getElementById("id_number").value || ''}\n\n`;
        text += `  - رقم الجوال: ${document.getElementById("mobile_number").value || ''}\n\n`;
        text += `  - رقم العداد: ${document.getElementById("meter_number").value || ''}\n\n`;
        text += `  - رقم الحساب الرئيسي: ${document.getElementById("main_account").value || ''}\n\n`;
        text += `  - رقم الحساب الفرعي: ${document.getElementById("sub_account").value || ''}\n`;

        const outputSection = document.getElementById("outputSection");
        const outputText = document.getElementById("outputText");
        
        outputText.value = text;
        outputSection.style.display = "block";
        
        outputText.select();
        outputText.setSelectionRange(0, 99999);
        
        try {
            navigator.clipboard.writeText(text);
        } catch (err) {}
    }
</script>

</body>
</html>
