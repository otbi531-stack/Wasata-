<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وسطاء المملكة</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="وسطاء المملكة">
<meta property="og:title" content="وسطاء المملكة">
<meta property="og:description" content="عروض عقارية - وسطاء المملكة">
<style>
:root{--primary:#1f6f54;--primary-dark:#164f3c;--accent:#d98a3d;--text:#1f2430;--muted:#6b7280;--border:#e5e7eb;--danger:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#12160e;color:var(--text);padding-bottom:40px}
button{font-family:inherit}
header{width:100%;aspect-ratio:9/16;background:url(header.jpg) center top/100% 100% no-repeat,linear-gradient(#1f6f54,#12160e)}
.container{max-width:720px;margin:0 auto;padding:14px 16px}
.add-btn{width:100%;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.lib-buttons{display:flex;gap:10px;margin-bottom:10px}
.lib-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.96);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.lib-icon{font-size:26px}
.lib-text{font-size:14px;font-weight:700;color:var(--text)}
.lib-count{font-size:12px;font-weight:700;color:#fff;background:var(--primary);border-radius:999px;padding:2px 10px;margin-top:2px}
.lib-requests .lib-count{background:var(--accent)}
.backup{display:block;margin:0 auto;border:0;background:none;color:#cfd6c4;font-size:12px;text-decoration:underline;cursor:pointer}
.lib-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;background:rgba(255,255,255,.92);border-radius:12px;padding:10px 14px}
.lib-back{border:0;background:none;color:var(--primary-dark);font-size:14px;font-weight:700;cursor:pointer}
.lib-title{margin:0;font-size:16px}
.card{background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.card img{width:100%;height:170px;object-fit:cover;display:block;background:#eee}
.card-body{padding:12px 14px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-title{font-size:16px;font-weight:700;margin:0 0 2px}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:700;white-space:nowrap}
.badge.offer{background:#e3f3ec;color:var(--primary-dark)}
.badge.request{background:#fdefe0;color:#9a5a13}
.price{color:var(--primary-dark);font-weight:700;font-size:15px;margin:6px 0 2px}
.location{color:var(--muted);font-size:13px;margin:0 0 6px}
.location a{color:var(--primary-dark)}
.desc{font-size:13.5px;color:#374151;line-height:1.6;margin:0 0 10px;white-space:pre-wrap}
.card-actions{display:flex;gap:8px}
.btn-small{flex:1;padding:8px 6px;border-radius:9px;border:0;font-size:13px;cursor:pointer;font-weight:600}
.btn-sold{background:#eef2f6;color:var(--text);border:1px solid var(--border)}
.btn-delete{background:#fdecea;color:var(--danger)}
.empty{text-align:center;color:#f2f2f2;background:rgba(0,0,0,.4);border-radius:14px;padding:50px 20px;font-size:14px}
.loading{text-align:center;padding:40px;color:#cfd6c4;font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.overlay.show{display:flex}
.modal{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 18px 22px;max-height:88vh;overflow-y:auto}
.modal h2{margin:0 0 14px;font-size:18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input[type=text],.field textarea,.field select{width:100%;padding:10px;border-radius:9px;border:1px solid var(--border);font-size:14px;font-family:inherit;background:#fafafa}
.field textarea{resize:vertical;min-height:70px}
.img-preview{width:100%;height:140px;object-fit:cover;border-radius:9px;margin-top:8px;display:none;background:#eee}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions button{flex:1;padding:12px;border-radius:10px;border:0;font-size:14px;font-weight:700;cursor:pointer}
.modal-actions button:disabled{opacity:.6}
.btn-save{background:var(--primary);color:#fff}
.btn-cancel{background:#eef2f6;color:var(--text)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2430;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<header aria-label="وسطاء المملكة"></header>

<div class="container">
  <button class="add-btn" id="openAddBtn">+ إضافة جديد</button>

  <div id="homeButtons">
    <div class="lib-buttons">
      <button class="lib-btn" id="openOffersBtn"><span class="lib-icon">🏢</span><span class="lib-text">مكتبة العروض</span><span class="lib-count" id="offersCount">0</span></button>
      <button class="lib-btn lib-requests" id="openRequestsBtn"><span class="lib-icon">📋</span><span class="lib-text">مكتبة الطلبات</span><span class="lib-count" id="requestsCount">0</span></button>
    </div>
    <button class="backup" id="backupBtn">تنزيل نسخة احتياطية</button>
  </div>

  <div id="libraryView" style="display:none">
    <div class="lib-header">
      <button class="lib-back" id="libBackBtn">→ رجوع</button>
      <h2 class="lib-title" id="libTitle">مكتبة العروض</h2>
    </div>
    <div id="listArea" class="loading">جاري تحميل البيانات...</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>إضافة إعلان</h2>
    <div class="field"><label>نوع الإعلان</label><select id="fListingType"><option>عرض</option><option>طلب</option></select></div>
    <div class="field"><label>نوع العقار</label><select id="fPropertyType"></select></div>
    <div class="field"><label>المدينة</label><select id="fCity"></select></div>
    <div class="field"><label>الحي</label><input type="text" id="fNeighborhood" placeholder="مثال: حي الملقا"></div>
    <div class="field"><label>المساحة</label><input type="text" id="fArea" placeholder="مثال: 350 م²"></div>
    <div class="field"><label>قوقل ماب</label><input type="text" id="fMapLink" placeholder="الصق رابط الموقع من خرائط قوقل (يبدأ بـ https)"></div>
    <div class="field"><label>المطلوب</label><input type="text" id="fPrice" placeholder="مثال: 450,000 ريال أو حسب الاتفاق"></div>
    <div class="field"><label>الوسيط</label><input type="text" id="fAgent" placeholder="اسم الوسيط"></div>
    <div class="field"><label>رقم الجوال</label><input type="text" id="fPhone" placeholder="05xxxxxxxx"></div>
    <div class="field"><label>التفاصيل</label><textarea id="fDesc" placeholder="عدد الغرف، ملاحظات إضافية..."></textarea></div>
    <div class="field"><label>صورة (اختياري)</label><input type="file" id="fImage" accept="image/*"><img id="fImagePreview" class="img-preview" alt=""></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">إلغاء</button>
      <button class="btn-save" id="saveBtn">حفظ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDSJxDhDUlDHmNOMsNJu5BEP9TxzifKux0",
  authDomain: "wasata-almamlaka.firebaseapp.com",
  projectId: "wasata-almamlaka",
  storageBucket: "wasata-almamlaka.firebasestorage.app",
  messagingSenderId: "438101358213",
  appId: "1:438101358213:web:a013f7e4c6f02d7725dbec"
};
const COL = 'listings'; // كل إعلان مستند مستقل
const PROPS = ['شقة','فيلا','دور','أرض','عمارة','استراحة','محل تجاري','مستودع','مكتب','أخرى'];
const CITIES = ['الرياض','جدة','مكة المكرمة','المدينة المنورة','الدمام','الخبر','الظهران','الطائف','تبوك','بريدة','خميس مشيط','أبها','حائل','نجران','جازان','الجبيل','ينبع','القطيف','عرعر','سكاكا','الباحة','أخرى'];
const $ = id => document.getElementById(id);
let db, uid = null, listings = [], lib = null, pendingImage = null, saving = false;

function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600); }
function fail(ctx, e){ console.error(ctx, e); toast('خطأ: ' + ((e && (e.code || e.message)) || ctx)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeUrl(u){ return /^https?:\/\//i.test(u || '') ? u : ''; }
function safeImg(u){ return /^data:image\/(jpeg|png|webp);base64,/.test(u || '') ? u : ''; }
function fill(id, arr){ $(id).innerHTML = arr.map(v => '<option>' + v + '</option>').join(''); }

async function init(){
  fill('fPropertyType', PROPS); fill('fCity', CITIES);
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    try{
      await firebase.auth().signInAnonymously();
      uid = firebase.auth().currentUser.uid;
    }catch(e){ fail('auth', e); }
    db.collection(COL).onSnapshot(s => {
      listings = s.docs.map(d => ({...d.data(), id: d.id})).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      render();
    }, e => fail('listen', e));
    if(uid) migrate().catch(e => console.warn('migrate', e));
  }catch(e){ fail('init', e); }
}

// نقل الإعلانات القديمة (مستند واحد) إلى النظام الجديد مرة واحدة
async function migrate(){
  const ref = db.collection('wasata').doc('listings');
  const s = await ref.get();
  const items = s.exists && Array.isArray(s.data().items) ? s.data().items : [];
  if(!items.length) return;
  for(let i = 0; i < items.length; i += 20){
    const b = db.batch();
    items.slice(i, i + 20).forEach((it, j) => {
      const {id, ...rest} = it;
      const k = String(id || ('old-' + (i + j)));
      b.set(db.collection(COL).doc(k), {...rest, ownerId: uid, createdAt: parseInt(k.split('-')[1]) || Date.now()});
    });
    await b.commit();
  }
  await ref.set({items: [], migratedAt: Date.now()});
  toast('تم نقل الإعلانات القديمة إلى النظام الجديد');
}

function render(){
  const offers = listings.filter(l => l.type !== 'طلب').length;
  $('offersCount').textContent = offers;
  $('requestsCount').textContent = listings.length - offers;
  if(!lib) return;
  const rows = listings.filter(l => (lib === 'طلب') === (l.type === 'طلب'));
  const area = $('listArea'); area.className = '';
  if(!rows.length){ area.innerHTML = '<div class="empty">لا توجد عناصر في هذه المكتبة حالياً 🏡<br>اضغط "إضافة جديد" لإضافة عنصر</div>'; return; }
  area.innerHTML = rows.map(it => {
    const map = safeUrl(it.mapLink), im = safeImg(it.image), ph = String(it.phone || '').replace(/[^\d+]/g, '');
    const mine = uid && it.ownerId === uid, id = esc(it.id);
    return `<div class="card">${im ? `<img src="${im}" alt="صورة العقار">` : ''}<div class="card-body">
      <div class="card-top"><h3 class="card-title">${esc(it.propertyType || 'عقار')} - ${esc(it.city)}</h3><span class="badge ${it.type === 'طلب' ? 'request' : 'offer'}">${esc(it.type || 'عرض')}</span></div>
      ${it.neighborhood ? `<div class="location">📍 حي ${esc(it.neighborhood)}</div>` : ''}
      ${it.area ? `<div class="location">📐 المساحة: ${esc(it.area)}</div>` : ''}
      ${map ? `<div class="location">🗺️ <a href="${esc(map)}" target="_blank" rel="noopener noreferrer">قوقل ماب</a></div>` : ''}
      ${it.price ? `<div class="price">${esc(it.price)}</div>` : ''}
      ${it.agent ? `<div class="location">🧑‍💼 الوسيط: ${esc(it.agent)}</div>` : ''}
      ${ph ? `<div class="location">📞 <a href="tel:${esc(ph)}">${esc(it.phone)}</a></div>` : ''}
      ${it.desc ? `<div class="desc">${esc(it.desc)}</div>` : ''}
      ${mine ? `<div class="card-actions"><button class="btn-small btn-sold" data-act="sold" data-id="${id}">✅ تم البيع / الإتمام</button><button class="btn-small btn-delete" data-act="del" data-id="${id}">🗑 حذف</button></div>` : ''}
    </div></div>`;
  }).join('');
}

$('listArea').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if(!b) return;
  const del = b.dataset.act === 'del';
  if(!confirm(del ? 'حذف هذا الإعلان نهائياً؟' : 'تأكيد إتمام الصفقة وإزالة الإعلان؟')) return;
  try{ await db.collection(COL).doc(b.dataset.id).delete(); toast(del ? 'تم الحذف' : 'تمت إزالة الإعلان بعد الإتمام ✅'); }
  catch(err){ fail('delete', err); }
});

function showHome(){ lib = null; $('homeButtons').style.display = 'block'; $('libraryView').style.display = 'none'; }
function showLibrary(t){ lib = t; $('homeButtons').style.display = 'none'; $('libraryView').style.display = 'block'; $('libTitle').textContent = t === 'طلب' ? 'مكتبة الطلبات' : 'مكتبة العروض'; render(); }

function openModal(){
  pendingImage = null;
  $('fListingType').value = 'عرض'; $('fPropertyType').value = PROPS[0]; $('fCity').value = CITIES[0];
  ['fNeighborhood','fArea','fMapLink','fPrice','fAgent','fPhone','fDesc','fImage'].forEach(id => $(id).value = '');
  $('fImagePreview').style.display = 'none';
  $('overlay').classList.add('show');
}
function closeModal(){ $('overlay').classList.remove('show'); }
$('openAddBtn').addEventListener('click', openModal);
$('openOffersBtn').addEventListener('click', () => showLibrary('عرض'));
$('openRequestsBtn').addEventListener('click', () => showLibrary('طلب'));
$('libBackBtn').addEventListener('click', showHome);
$('cancelBtn').addEventListener('click', closeModal);
$('overlay').addEventListener('click', e => { if(e.target === $('overlay')) closeModal(); });

// ضغط الصورة قبل الحفظ (تبقى أقل من حد المستند)
$('fImage').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const im = new Image(), url = URL.createObjectURL(f);
  im.onload = () => {
    const s = Math.min(1, 800 / im.width), c = document.createElement('canvas');
    c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    let q = .7, d = c.toDataURL('image/jpeg', q);
    while(d.length > 400000 && q > .3){ q -= .1; d = c.toDataURL('image/jpeg', q); }
    pendingImage = d;
    const p = $('fImagePreview'); p.src = d; p.style.display = 'block';
    URL.revokeObjectURL(url);
  };
  im.onerror = () => toast('تعذر قراءة الصورة');
  im.src = url;
});

$('saveBtn').addEventListener('click', async () => {
  if(saving) return;
  if(!uid){ toast('تعذر التحقق من الجهاز. فعّل الدخول المجهول في Firebase ثم حدّث الصفحة'); return; }
  const mapLink = $('fMapLink').value.trim();
  if(mapLink && !safeUrl(mapLink)){ toast('رابط الخريطة يجب أن يبدأ بـ https://'); return; }
  const item = {
    type: $('fListingType').value, propertyType: $('fPropertyType').value, city: $('fCity').value,
    neighborhood: $('fNeighborhood').value.trim(), area: $('fArea').value.trim(), mapLink,
    price: $('fPrice').value.trim(), agent: $('fAgent').value.trim(), phone: $('fPhone').value.trim(),
    desc: $('fDesc').value.trim(), image: pendingImage || null, ownerId: uid, createdAt: Date.now()
  };
  saving = true; $('saveBtn').disabled = true;
  try{ await db.collection(COL).add(item); closeModal(); toast('تم الحفظ 🎉'); }
  catch(e){ fail('save', e); }
  finally{ saving = false; $('saveBtn').disabled = false; }
});

// نسخة احتياطية عند الطلب فقط
$('backupBtn').addEventListener('click', () => {
  const data = listings.map(it => ({
    "المعرف": it.id, "نوع الإعلان": it.type || 'عرض', "نوع العقار": it.propertyType || '', "المدينة": it.city || '',
    "الحي": it.neighborhood || '', "المساحة": it.area || '', "قوقل ماب": it.mapLink || '', "المطلوب": it.price || '',
    "الوسيط": it.agent || '', "رقم الجوال": it.phone || '', "التفاصيل": it.desc || '', "يوجد صورة": it.image ? 'نعم' : 'لا'
  }));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'}));
  a.download = 'قاعدة-بيانات-وسطاء-المملكة.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

init();
</script>
</body>
</html>
